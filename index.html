;width:100%;background:transparent;border:0;color:var(--text);text-align:left}.day-number{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#272945;color:#cbbdff;font-weight:800;flex:none}.day-number.finished{background:#184b48;color:#98f5dd}.lesson-head .grow{flex:1}.lesson-head strong{display:block;font-size:14px;margin-bottom:4px}.lesson-head small{color:var(--muted)}.chev{color:var(--dim);font-size:19px}.lesson-content{border-top:1px solid var(--border);padding:20px}.lesson-content p{color:var(--muted);line-height:1.7}.lesson-content h4{margin:17px 0 10px;color:#d6d5ec}.task-list{display:grid;gap:10px}.task{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid var(--border);border-radius:11px;background:#1a2030;cursor:pointer;line-height:1.5}.task input,.checkpoint input{accent-color:#a18dff;width:17px;height:17px;margin:2px 0 0;flex:none}.task:has(input:checked){border-color:#427b74;background:#1b3439}.task:has(input:checked) span{text-decoration:line-through;color:#b0c6c3}.notes{width:100%;background:#111724;border:1px solid var(--border);border-radius:11px;color:var(--text);padding:13px;min-height:88px;resize:vertical}.button-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.resource{display:flex;gap:15px;align-items:flex-start;padding:20px}.resource-icon{font-size:23px;background:#2c2a45;border-radius:11px;width:45px;height:45px;display:grid;place-items:center;flex:none}.resource p{color:var(--muted);line-height:1.6;margin:7px 0 0}.resource a{font-weight:800}.resources{display:grid;gap:12px}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.project-card{padding:22px}.project-card .emoji{font-size:27px;margin-bottom:13px}.project-card p,.project-card li{color:var(--muted);line-height:1.65}.project-card ul{padding-left:19px}.checkpoint{display:flex;align-items:flex-start;gap:13px;padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer}.checkpoint:last- </style></head><body>
<div class="mobile-header"><div class="logo"><span class="logo-mark">⌘</span> python<span style="color:#a18dff">path</span></div><button class="btn small" id="menuToggle" aria-label="Open navigation">☰ Menu</button></div>
<div class="app"><aside class="sidebar" id="sidebar"><div class="logo"><span class="logo-mark">⌘</span> python<span style="color:#a18dff">path</span></div><div class="tagline">YOUR WORKSPACE</div><nav id="navMain"></nav><div class="tagline">THE CURRICULUM</div><nav id="navWeeks"></nav><div class="side-bottom">BUILD · BREAK · DEBUG · REPEAT<br/><strong>8 weeks · 56 days · 112 hours</strong></div></aside><main class="main"><div class="topbar"><span class="breadcrumb" id="breadcrumb">My learning journey / Overview</span><span class="pill">✦ LEARN BY BUILDING</span></div><div id="content" aria-live="polite"></div><footer class="footer"><span>Python Path · Free, self-paced programming roadmap</span><span>Progress is stored locally in this browser. <a href="#settings" data-route="settings">Back it up →</a></span></footer></main></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"/>
<script>
'use strict';
const raw=[
{title:'Python fundamentals',subtitle:'Make the computer do something useful.',topics:['Installing Python & your first script','Variables, types & user input','Strings and numbers','Conditions and comparisons','For loops and ranges','While loops and basic debugging','Build: calculator + guessing game'],project:'Calculator and number-guessing game',goal:'Write an interactive program without copying a tutorial.',build:['Create a working calculator with basic operations','Build a guessing game with hints and replay option']},
{title:'Functions & data structures',subtitle:'Turn messy scripts into reusable programs.',topics:['Defining and calling functions','Arguments and return values','Lists and indexing','Dictionaries and key/value data','Sets, tuples and strings','Putting functions together','Build: command-line to-do list'],project:'CLI to-do list',goal:'Split a program into named, reusable functions.',build:['Add, list, complete and remove tasks','Organize the program into clearly named functions']},
{title:'Files & debugging',subtitle:'Make your programs remember things.',topics:['Reading and writing text files','Working with JSON','Errors and try/except','Modules and imports','Debugging with breakpoints','Git basics and GitHub','Build: persistent expense tracker'],project:'Persistent expense tracker',goal:'Save data reliably and diagnose errors.',build:['Record and list expenses, including totals','Save and load expenses from JSON across runs']},
{title:'Real data & APIs',subtitle:'Connect Python to the outside world.',topics:['pip and virtual environments','HTTP requests and response codes','Read JSON API responses','Handle missing data and network errors','Build a lookup interface','Save favorites and simple tests','Build: weather or Pokémon lookup'],project:'Weather / Pokémon lookup',goal:'Fetch, parse and display API data, including failures.',build:['Fetch real information from a public API','Handle invalid input and network failures gracefully']},
{title:'Maintainable Python',subtitle:'Write code future-you will understand.',topics:['Organizing files into modules','Separating UI from logic','Objects and classes','Introducing pytest','Testing edge cases','Refactor your expense tracker','Review, test and document'],project:'Refactored expense tracker + tests',goal:'Explain program structure and run tests after changes.',build:['Separate user interface, business logic and storage','Write automated tests for important behavior']},
{title:'Original project: planning',subtitle:'Go from idea to your own roadmap.',topics:['Choose a real-world problem','Write requirements and user stories','Plan your data model and project structure','Set up your repository and README','Implement feature one','Implement feature two','Demo and adjust the plan'],project:'Original project — first working features',goal:'Implement a feature from your own written requirement.',build:['Write a README with requirements and run instructions','Complete two independently planned features']},
{title:'Original project: building',subtitle:'Learn to solve unfamiliar problems.',topics:['Validate user input','Handle unexpected edge cases','Read library documentation','Debug one real issue thoroughly','Add automated tests','Complete core features','Mentor review and bug fixes'],project:'Original project — core features',goal:'Find and explain the root cause of a bug.',build:['Finish the essential features','Cover core functionality with tests and verify edge cases']},
{title:'Ship & showcase',subtitle:'Finish something you’re proud to share.',topics:['Review and simplify code','Improve readability and naming','Document setup and usage','Add an example and screenshots','Run tests and resolve bugs','Push final version to GitHub','Give your final project demo'],project:'Published, documented GitHub project',goal:'Demonstrate, explain and improve a complete small app.',build:['Publish a clean repository with instructions','Demonstrate the project and explain technical decisions']}
];
const weeks=raw.map((w,i)=>({...w,id:i+1,days:w.topics.map((t,d)=>({id:i*7+d+1,title:t,learn:d===6?`Bring together what you studied this week. Focus on shipping a working version of ${w.project.toLowerCase()}.`:`Study “${t}” using your chosen main course. Change the examples and predict the output before running them.`,practice:d===6?'Test unusual inputs, trace any bugs, and explain why your final code works.':`Write two tiny exercises using ${t.toLowerCase()}. Avoid looking at completed solutions.`,build:d===6?`Complete the weekly milestone: ${w.project}.`:`Apply today's concept to your current weekly project: ${w.project}.`,review:'Write down what worked, what was confusing, and commit your changes.'}))}));
const key='python-path-progress-v1';let state={tasks:{},notes:{},checkpoints:{},name:'',startDate:''};try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')state={...state,...s}}catch(e){}let page='overview',selectedWeek=1,openDay=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){alert('Browser storage is unavailable. Export your progress so it is not lost.')}};
const itemsFor=id=>[0,1,2,3].map(i=>`${id}:${i}`);const dayDone=id=>itemsFor(id).every(k=>state.tasks[k]);const doneDays=()=>weeks.flatMap(w=>w.days).filter(d=>dayDone(d.id)).length;const doneTasks=()=>Object.values(state.tasks).filter(Boolean).length;const pct=w=>Math.round(w.days.filter(d=>dayDone(d.id)).length/7*100);const allPct=()=>Math.round(doneDays()/56*100);
const setRoute=(p,w)=>{page=p;if(w)selectedWeek=w;openDay=null;render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('sidebar').classList.remove('mobile-open');history.replaceState(null,'','#'+(p==='week'?`week-${selectedWeek}`:p));};
const progressbar=n=>`<div class="progress" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="100"><div style="width:${n}%"></div></div>`;
const hero=()=>`<section class="hero"><span class="eyebrow">THE 8-WEEK DEVELOPER JOURNEY</span><h1>Learn Python.<br/><span style="color:#bbafff">Build real things.</span></h1><p>Forget endless tutorials. Learn one concept, practice it, and turn it into a real project — every day, at your own pace.</p><button class="btn primary" data-action="continue">${doneDays()?'Continue learning':'Start learning'} →</button></section>`;
const stats=()=>`<div class="stats"><div class="stat"><label>OVERALL PROGRESS</label><strong>${allPct()}%</strong>${progressbar(allPct())}</div><div class="stat"><label>DAYS COMPLETED</label><strong>${doneDays()} <span>/ 56</span></strong><span>Four tasks per day</span></div><div class="stat"><label>LEARNING TASKS</label><strong>${doneTasks()} <span>/ 224</span></strong><span>Learn, practice, build, review</span></div><div class="stat"><label>LEARNING HOURS</label><strong>${(doneTasks()*.5).toFixed(1)} <span>/ 112</span></strong><span>Estimated from task completion</span></div></div>`;
const weekCards=()=>`<div class="week-grid">${weeks.map(w=>`<button class="week-card" data-route="week" data-week="${w.id}"><div class="week-top"><span class="week-no">WEEK ${String(w.id).padStart(2,'0')}</span><span class="tiny muted">${pct(w)}% complete</span></div><h3>${esc(w.title)}</h3><p>${esc(w.subtitle)}</p>${progressbar(pct(w))}<div style="height:9px"></div><small>${w.days.filter(d=>dayDone(d.id)).length} of 7 days finished · ${esc(w.project)}</small></button>`).join('')}</div>`;
function overview(){return `${hero()}${stats()}<div class="section-title"><h2>Your daily routine</h2><span class="muted tiny">2 hours per day</span></div><div class="grid2"><section class="panel routine">${[['25 min','📖 Learn','Study one concept and experiment with examples.'],['35 min','🧠 Practice','Solve short challenges before checking hints.'],['50 min','💻 Build','Turn what you learned into a project feature.'],['10 min','✅ Review','Explain your progress and commit your code.']].map(a=>`<div class="routine-item"><span class="routine-time">${a[0]}</span><div><strong>${a[1]}</strong><p>${a[2]}</p></div></div>`).join('')}</section><section class="panel"><span class="eyebrow">THE NEXT STEP</span><h2 style="margin:12px 0">${doneDays()===56?'You did it! 🎉':'One day at a time.'}</h2><p class="muted" style="line-height:1.8">${doneDays()===56?'All 56 days are complete. Show your final project and keep building.':'Progress is earned by completing the four activities for each day. You can work at your own speed — this is a roadmap, not a race.'}</p><button class="btn secondary" data-action="continue">Open next lesson →</button><div class="tip" style="margin-top:20px"><strong>Golden rule:</strong> Write code every day. Spending 60–70% of your learning time solving and debugging real problems beats watching tutorial after tutorial.</div></section></div><div class="section-title"><h2>Explore the roadmap</h2><span class="muted tiny">8 weeks · 4 projects + final build</span></div>${weekCards()}`}
function weeksView(){return `<div class="eyebrow">YOUR COURSE</div><h1>8 weeks. Real progress.</h1><p class="muted" style="line-height:1.8;max-width:720px">Every week has seven focused days, a clear practical project and a milestone. Open any week to see its daily learning plan.</p>${stats()}${weekCards()}`}
function dayHTML(d,week){const expanded=openDay===d.id;let labels=[['📖 Learn · 25 minutes',d.learn],['🧠 Practice · 35 minutes',d.practice],['💻 Build · 50 minutes',d.build],['✅ Review · 10 minutes',d.review]];return `<article class="lesson"><button class="lesson-head" data-action="toggle-day" data-day="${d.id}" aria-expanded="${expanded}"><span class="day-number ${dayDone(d.id)?'finished':''}">${dayDone(d.id)?'✓':d.id-(week.id-1)*7}</span><span class="grow"><strong>Day ${d.id} · ${esc(d.title)}</strong><small>${itemsFor(d.id).filter(k=>state.tasks[k]).length}/4 tasks completed ${dayDone(d.id)?' · Completed':''}</small></span><span class="chev">${expanded?'⌃':'⌄'}</span></button>${expanded?`<div class="lesson-content"><p>Work through these activities at your own pace. Mark each one when you've actually completed it.</p><div class="task-list">${labels.map((a,i)=>`<label class="task"><input type="checkbox" data-task="${d.id}:${i}" ${state.tasks[`${d.id}:${i}`]?'checked':''}/><span><strong>${a[0]}</strong><br/>${esc(a[1])}</span></label>`).join('')}</div><h4>What did you learn today?</h4><textarea class="notes" data-note="${d.id}" placeholder="New concept, something confusing, a bug you solved...">${esc(state.notes[d.id]||'')}</textarea><div style="display:flex;justify-content:space-between;gap:10px;margin-top:10px;align-items:center"><small class="muted">Notes are saved automatically.</small><button class="btn small secondary" data-action="mark-day" data-day="${d.id}">${dayDone(d.id)?'Unmark day':'Mark all four complete'}</button></div></div>`:''}</article>`}
function weekView(){const w=weeks[selectedWeek-1];return `<div class="button-row" style="margin-bottom:21px"><button class="btn small" data-route="weeks">← All weeks</button><span class="week-no">WEEK ${String(w.id).padStart(2,'0')}</span></div><div class="week-header"><div><h1 style="margin:0 0 8px">${esc(w.title)}</h1><p>${esc(w.subtitle)} Work through these seven days, then complete the weekly project milestone.</p></div><div style="min-width:155px"><strong>${pct(w)}% complete</strong><div style="height:9px"></div>${progressbar(pct(w))}<p class="tiny">${w.days.filter(d=>dayDone(d.id)).length} / 7 days</p></div></div><div class="grid2" style="margin-bottom:25px"><section class="panel"><span class="eyebrow">WEEKLY PROJECT</span><h3 style="margin-top:12px">${esc(w.project)}</h3><p class="muted" style="line-height:1.7">${w.build.map(esc).join('. ')}.</p><div class="tiny highlight">✓ Target: ${esc(w.goal)}</div></section><section class="panel"><span class="eyebrow">THE CHECKPOINT</span><h3 style="margin-top:12px">Prove you can do it</h3><p class="muted" style="line-height:1.7">${esc(w.goal)}</p><button class="btn small" data-route="checkpoints">View all milestones →</button></section></div><div class="section-title"><h2>Daily lessons</h2><span class="muted tiny">Tap a day to see its activities</span></div><div class="day-list">${w.days.map(d=>dayHTML(d,w)).join('')}</div><div class="button-row" style="margin-top:21px"><button class="btn secondary" data-route="week" data-week="${Math.max(1,w.id-1)}" ${w.id===1?'disabled':''}>← Previous week</button><button class="btn primary" data-route="week" data-week="${Math.min(8,w.id+1)}" ${w.id===8?'disabled':''}>Next week →</button></div>`}
function projects(){const projects=[['☑️','CLI To-Do List','Beginner','Add, view, complete, and delete tasks.',['Persist tasks with JSON','Add due dates and priority','Filter and sort tasks']],['💸','Expense Tracker','Beginner → Intermediate','Record purchases, show totals, and explore spending.',['Group by category/month','Export CSV or JSON','Add tests and modular structure']],['🌦️','Weather / Pokémon Lookup','Intermediate','Call a public API and display information.',['Handle network errors','Cache results','Save favorites']],['🌱','Habit Tracker (final project idea)','Independent project','Track habits, streaks, and personal progress.',['Store data in SQLite','Add weekly stats','Document and test the app']]];return `<div class="eyebrow">LEARNING BY DOING</div><h1>Build your way to Python.</h1><p class="muted">Each project starts small. Add features as you grow more comfortable with the language.</p><div class="project-grid" style="margin-top:25px">${projects.map(x=>`<div class="project-card"><div class="emoji">${x[0]}</div><span class="eyebrow">${x[2]}</span><h3 style="margin:12px 0">${x[1]}</h3><p>${x[3]}</p><strong class="tiny">STRETCH FEATURES</strong><ul>${x[4].map(y=>`<li>${y}</li>`).join('')}</ul></div>`).join('')}</div><div class="tip" style="margin-top:20px"><strong>For your final project:</strong> Pick a problem that actually matters to you. A small finished application is better than an ambitious unfinished one.</div>`}
function resources(){return `<div class="eyebrow">LEARNING LIBRARY</div><h1>Excellent resources. Zero overwhelm.</h1><p class="muted">Pick <strong>one</strong> primary course and use the others for reference, not as parallel homework.</p><div class="resources" style="margin-top:24px"><div class="resource"><span class="resource-icon">🎓</span><div><a target="_blank" rel="noopener noreferrer" href="https://programming-26.mooc.fi/">University of Helsinki — Python MOOC ↗</a><p>Recommended starting point. Structured text lessons and loads of exercises.</p></div></div><div class="resource"><span class="resource-icon">🎬</span><div><a target="_blank" rel="noopener noreferrer" href="https://cs50.harvard.edu/python/">Harvard CS50P ↗</a><p>A great video-based alternative with problem sets and a final project.</p></div></div><div class="resource"><span class="resource-icon">📚</span><div><a target="_blank" rel="noopener noreferrer" href="https://docs.python.org/3/">Python documentation ↗</a><p>Language reference, standard library, and official tutorials.</p></div></div><div class="resource"><span class="resource-icon">🛠️</span><div><a target="_blank" rel="noopener noreferrer" href="https://www.python.org/downloads/">Install Python ↗</a><p>Grab a supported Python 3 release to begin.</p></div></div><div class="resource"><span class="resource-icon">💻</span><div><a target="_blank" rel="noopener noreferrer" href="https://code.visualstudio.com/">Visual Studio Code ↗</a><p>A beginner-friendly editor; install its Python extension.</p></div></div></div><div class="section-title"><h2>Use AI like a tutor</h2></div><div class="panel"><p class="muted" style="line-height:1.8">Spend 15–20 minutes on a problem before asking for help. Request hints, not full answers; then ask for a code review after your attempt. Rebuild a small feature from memory the following day.</p><div class="prompt" id="aiPrompt">I'm learning Python. Act as a programming tutor. Don't write the full solution for me. Ask guiding questions, provide small hints, and help me understand mistakes. Review my code after I've attempted the problem myself. Favor explanations and debugging strategies over generated implementations.</div><button class="btn secondary" data-action="copy-prompt">Copy tutoring prompt ↗</button></div>`}
function checkpoints(){const cs=[['Week 2','Build a command-line app with functions without following a tutorial.'],['Week 4','Read data from an API and save results locally.'],['Week 6','Split an original project idea into tasks and implement features independently.'],['Week 8','Demonstrate a complete project, explain the code, and diagnose a bug yourself.']];return `<div class="eyebrow">PROVE YOUR PROGRESS</div><h1>Milestones & reflection</h1><p class="muted">Mark these when you can demonstrate them — not just when you've read about them.</p><section class="panel" style="margin-top:24px"><h2>Four major checkpoints</h2>${cs.map((c,i)=>`<label class="checkpoint"><input type="checkbox" data-checkpoint="${i}" ${state.checkpoints[i]?'checked':''}/><span><strong>${c[0]}</strong><small>${c[1]}</small></span></label>`).join('')}</section><div class="section-title"><h2>Weekly self-review</h2></div><section class="panel"><p class="muted" style="line-height:1.8">After each week, answer these questions in your notes or GitHub README:</p><ol style="line-height:2;color:#d3d7e8"><li>What can I build now that I couldn't last week?</li><li>Which concept can I explain in my own words?</li><li>Where did I get stuck, and how did I resolve it?</li><li>What's the most important next step?</li></ol><div class="tip"><strong>Mentor tip:</strong> Ask an experienced friend to spend 30 minutes each week reviewing your code. Request one new feature, one tricky bug, and one code-quality improvement.</div></section>`}
function settings(){return `<div class="eyebrow">MY LEARNING DATA</div><h1>Progress & backups</h1><p class="muted" style="line-height:1.8;max-width:750px">Your course progress is stored <strong>in this browser on this device</strong>. It does not sync between devices or people. Each friend has their own progress when visiting the same website. Export regularly to avoid losing it if you clear browser data.</p><section class="panel" style="margin-top:25px"><h3>Your profile (optional)</h3><label class="muted tiny" for="studentName">Display name</label><input id="studentName" style="display:block;width:100%;margin:9px 0 19px;background:#101624;color:white;border:1px solid var(--border);border-radius:10px;padding:12px" placeholder="Your name" value="${esc(state.name)}"/><div class="button-row"><button class="btn primary" data-action="save-profile">Save profile</button></div></section><section class="panel" style="margin-top:18px"><h3>Backup and restore</h3><p class="muted">Download your checkboxes and daily reflections as a JSON file, or restore from an earlier export.</p><div class="account-tools"><button class="btn primary" data-action="export">↓ Export progress</button><button class="btn secondary" data-action="import">↑ Import progress</button></div></section><section class="panel" style="margin-top:18px"><h3>Reset progress</h3><p class="muted">Permanently clears the progress and reflections stored in this browser. Export a backup first.</p><button class="btn danger" data-action="reset">Reset all progress</button></section><div class="tip" style="margin-top:18px"><strong>Hosting note:</strong> This is a static website. You can publish it using GitHub Pages, Netlify, Cloudflare Pages or any static host. Shared accounts and multi-device sync would require adding authentication and a backend such as Supabase.</div>`}
function render(){const nav=[['overview','◈','Dashboard'],['weeks','▦','Roadmap'],['projects','◇','Projects'],['resources','♧','Resources'],['checkpoints','☑','Checkpoints'],['settings','⚙','Progress & data']];document.getElementById('navMain').innerHTML=nav.map(x=>`<button class="nav-button ${page===x[0]?'active':''}" data-route="${x[0]}"><span class="symbol">${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('navWeeks').innerHTML=weeks.map(w=>`<button class="nav-button ${page==='week'&&selectedWeek===w.id?'active':''}" data-route="week" data-week="${w.id}"><span class="symbol">${String(w.id).padStart(2,'0')}</span>${esc(w.title)}<small>${pct(w)}%</small></button>`).join('');document.getElementById('breadcrumb').textContent=`My learning journey / ${page==='week'?`Week ${selectedWeek}`:page[0].toUpperCase()+page.slice(1)}`;document.getElementById('content').innerHTML=({overview, weeks:weeksView, week:weekView, projects,resources,checkpoints,settings})[page]();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-route],[data-action]');if(!t)return;if(t.dataset.route){e.preventDefault();setRoute(t.dataset.route,Number(t.dataset.week));return}switch(t.dataset.action){case'continue':{const next=weeks.flatMap(w=>w.days).find(d=>!dayDone(d.id));const id=next?.id||56;setRoute('week',Math.ceil(id/7));openDay=id;render();break}case'toggle-day':openDay=openDay===Number(t.dataset.day)?null:Number(t.dataset.day);render();break;case'mark-day':{const id=Number(t.dataset.day),finish=!dayDone(id);itemsFor(id).forEach(k=>state.tasks[k]=finish);save();openDay=id;render();break}case'copy-prompt':{const value=document.getElementById('aiPrompt').textContent;navigator.clipboard?.writeText(value).then(()=>{t.textContent='✓ Copied'},()=>{prompt('Copy this prompt:',value)});break}case'save-profile':state.name=document.getElementById('studentName').value.trim().slice(0,80);save();t.textContent='✓ Saved';break;case'export':{const blob=new Blob([JSON.stringify({app:'python-path',version:1,exportedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='python-path-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('Clear ALL Python Path progress and daily notes in this browser? This cannot be undone.')){state={tasks:{},notes:{},checkpoints:{},name:'',startDate:''};save();render()}break;}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-task]')){state.tasks[t.dataset.task]=t.checked;save();render()}if(t.matches('[data-checkpoint]')){state.checkpoints[t.dataset.checkpoint]=t.checked;save();render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){state.notes[e.target.dataset.note]=e.target.value;save()}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='python-path'||data.version!==1||!data.progress||typeof data.progress!=='object'||typeof data.progress.tasks!=='object'||typeof data.progress.notes!=='object'||typeof data.progress.checkpoints!=='object')throw Error('Unsupported backup file');if(!confirm('Replace current progress with the imported backup?'))return;state={tasks:{},notes:{},checkpoints:{},name:'',startDate:'',...data.progress};save();render();alert('Progress imported successfully.')}catch(err){alert('Cannot import backup: '+err.message)}finally{e.target.value=''}});
document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('mobile-open'));
const hash=location.hash.slice(1),m=hash.match(/^week-([1-8])$/);if(m){page='week';selectedWeek=Number(m[1])}else if(['overview','weeks','projects','resources','checkpoints','settings'].includes(hash))page=hash;render();
</script></body></html>
